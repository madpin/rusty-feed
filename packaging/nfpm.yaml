name: rusty-feed
arch: ${NFPM_ARCH}
platform: linux
version: ${NFPM_VERSION}
section: net
priority: optional
maintainer: Rusty Feed contributors
description: Self-hosted, multi-user, AI-augmented RSS reader
vendor: Rusty Feed
homepage: https://github.com/madpin/rusty-feed
license: MIT
depends:
  - ca-certificates
contents:
  - src: ${NFPM_BINARY_DIR}/rusty-feed-server
    dst: /usr/bin/rusty-feed-server
    expand: true
    file_info:
      mode: 0755
  - src: ${NFPM_BINARY_DIR}/rusty-feed-worker
    dst: /usr/bin/rusty-feed-worker
    expand: true
    file_info:
      mode: 0755
  - src: ${NFPM_BINARY_DIR}/rusty-feed-cli
    dst: /usr/bin/rusty-feed-cli
    expand: true
    file_info:
      mode: 0755
  - src: contrib/systemd/rusty-feed.service
    dst: /usr/lib/systemd/system/rusty-feed.service
  - src: contrib/systemd/rusty-feed-worker.service
    dst: /usr/lib/systemd/system/rusty-feed-worker.service
  - src: .env.example
    dst: /usr/share/doc/rusty-feed/rusty-feed.env.example
  - src: README.md
    dst: /usr/share/doc/rusty-feed/README.md
  - src: docs/OPERATIONS.md
    dst: /usr/share/doc/rusty-feed/OPERATIONS.md
scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
overrides:
  deb:
    depends:
      - ca-certificates
      - libssl3 | libssl3t64
    recommends:
      - postgresql-17
  rpm:
    depends:
      - ca-certificates
      - openssl-libs
      - shadow-utils
