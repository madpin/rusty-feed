[package]
name = "rustss-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "RustSS standalone AGENTS runtime (background workers)."

[[bin]]
name = "rustss-worker"
path = "src/main.rs"

[dependencies]
rustss-core = { workspace = true, features = ["telemetry"] }
rustss-agents = { workspace = true }
rustss-db = { workspace = true }
rustss-feeds = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
