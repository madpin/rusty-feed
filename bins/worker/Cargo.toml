[package]
name = "rusty-feed-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rusty Feed standalone AGENTS runtime (background workers)."

[[bin]]
name = "rusty-feed-worker"
path = "src/main.rs"

[dependencies]
rusty-feed-core = { workspace = true, features = ["telemetry"] }
rusty-feed-agents = { workspace = true }
rusty-feed-db = { workspace = true }
rusty-feed-feeds = { workspace = true }
rusty-feed-extract = { workspace = true }
rusty-feed-embed = { workspace = true }
rusty-feed-llm = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
sd-notify = { workspace = true }
