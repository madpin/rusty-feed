[package]
name = "rusty-feed-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rusty Feed HTTP server (optionally embeds the AGENTS worker)."

[[bin]]
name = "rusty-feed-server"
path = "src/main.rs"

[dependencies]
rusty-feed-core = { workspace = true, features = ["telemetry"] }
rusty-feed-web = { workspace = true }
rusty-feed-db = { workspace = true }
rusty-feed-cache = { workspace = true }
rusty-feed-agents = { workspace = true }
rusty-feed-embed = { workspace = true }
rusty-feed-llm = { workspace = true }
rusty-feed-feeds = { workspace = true }
rusty-feed-extract = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
sd-notify = { workspace = true }

# jemalloc isn't available on MSVC; irrelevant here (Linux-only deploys) but
# kept as the crate's documented guard.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
