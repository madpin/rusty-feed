[package]
name = "rustss-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "RustSS HTTP server (optionally embeds the AGENTS worker)."

[[bin]]
name = "rustss-server"
path = "src/main.rs"

[dependencies]
rustss-core = { workspace = true, features = ["telemetry"] }
rustss-web = { workspace = true }
rustss-db = { workspace = true }
rustss-cache = { workspace = true }
rustss-agents = { workspace = true }
rustss-embed = { workspace = true }
rustss-llm = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
