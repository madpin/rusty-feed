name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

# Keep identical to ci.yml so the `release-*` Rust caches saved from main match
# this workflow's cache key (FND-251).
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  binaries:
    name: binary · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is pinned to Ubuntu 24.04 (glibc 2.39). `ubuntu-latest` is
          # 26.04 (glibc 2.43), and binaries linked there do not start on
          # Debian 13, Ubuntu 24.04, or the Debian 13 runtime image (FND-250).
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            nfpm_arch: amd64
            image_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            nfpm_arch: arm64
            image_arch: arm64
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config openssl@3
      # Restore-only: Linux reuses the `release-<target>` caches CI saves from
      # main. A cache saved from a tag is visible to that tag alone, so saving
      # here only spent the repository's 10 GB cache budget.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: false
      - name: Build versioned binaries
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin rusty-feed-server --bin rusty-feed-worker --bin rusty-feed-cli
      - name: Check the glibc floor
        if: runner.os == 'Linux'
        run: scripts/check-glibc-floor.sh "target/${{ matrix.target }}/release"
      - name: Package binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          archive="rusty-feed-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" rusty-feed-server rusty-feed-worker rusty-feed-cli
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Build Debian and RPM packages
        if: runner.os == 'Linux'
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          NFPM_BINARY_DIR: target/${{ matrix.target }}/release
        run: |
          set -euo pipefail
          export NFPM_VERSION="${GITHUB_REF_NAME#v}"
          image="ghcr.io/goreleaser/nfpm:v2.47.0"
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e NFPM_ARCH -e NFPM_BINARY_DIR -e NFPM_VERSION "$image" \
            package --config packaging/nfpm.yaml --packager deb \
            --target "rusty-feed-${GITHUB_REF_NAME}-${{ matrix.target }}.deb"
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -e NFPM_ARCH -e NFPM_BINARY_DIR -e NFPM_VERSION "$image" \
            package --config packaging/nfpm.yaml --packager rpm \
            --target "rusty-feed-${GITHUB_REF_NAME}-${{ matrix.target }}.rpm"
          shasum -a 256 rusty-feed-*.deb rusty-feed-*.rpm > "rusty-feed-${GITHUB_REF_NAME}-${{ matrix.target }}-packages.sha256"
      - name: Generate Linux binary SBOM
        if: runner.os == 'Linux'
        uses: anchore/sbom-action@v0
        with:
          path: target/${{ matrix.target }}/release
          artifact-name: rusty-feed-${{ github.ref_name }}-${{ matrix.target }}-sbom.spdx.json
          output-file: rusty-feed-${{ github.ref_name }}-${{ matrix.target }}-sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: rusty-feed-${{ matrix.target }}
          path: |
            rusty-feed-*.tar.gz*
            rusty-feed-*.deb
            rusty-feed-*.rpm
            rusty-feed-*-packages.sha256
            rusty-feed-*-sbom.spdx.json
          if-no-files-found: error
      # Raw binaries for the container job. The artifact name must not match
      # the `rusty-feed-*` pattern the GitHub release downloads and publishes.
      - name: Stage binaries for the image
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/${{ matrix.image_arch }}"
          cp "target/${{ matrix.target }}/release/"rusty-feed-{server,worker,cli} "dist/${{ matrix.image_arch }}/"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: image-binaries-${{ matrix.image_arch }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  # Installs on the oldest supported userland (Ubuntu 24.04) and on the Debian 13
  # base of the runtime image rather than on the runner's newer OS, so a glibc
  # mismatch fails here instead of on users' machines (FND-250).
  package-smoke:
    name: install and upgrade Linux package
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rusty-feed-x86_64-unknown-linux-gnu
      - name: Inspect packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          deb=$(printf '%s\n' rusty-feed-*.deb)
          rpm_file=$(printf '%s\n' rusty-feed-*.rpm)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep '/usr/bin/rusty-feed-server'
          rpm -qpl "$rpm_file" | grep '/usr/bin/rusty-feed-server'
      - name: Exercise a repeat Debian install on supported distributions
        run: |
          set -euo pipefail
          deb=$(printf '%s\n' rusty-feed-*.deb)
          for image in ubuntu:24.04 debian:trixie-slim; do
            echo "== $image"
            docker run --rm -v "$PWD:/pkg:ro" "$image" sh -euc "
              apt-get update -qq
              apt-get install -y -qq /pkg/$deb
              apt-get install -y -qq --reinstall /pkg/$deb
              rusty-feed-cli --help
            "
          done

  # Packages the binaries from the `binaries` job (`binaries` build context), so
  # the ARM64 image is no longer compiled from source under QEMU; emulation is
  # needed only for the runtime stage's `apt-get` (FND-251).
  container:
    name: signed multi-architecture container
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: image-binaries-*
          path: dist
          merge-multiple: true
      - name: Restore executable bits dropped by the artifact round trip
        run: chmod 0755 dist/*/rusty-feed-*
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: optional_registries
        name: Detect optional registry credentials
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then echo "dockerhub=true" >> "$GITHUB_OUTPUT"; else echo "dockerhub=false" >> "$GITHUB_OUTPUT"; fi
          if [[ -n "$QUAY_TOKEN" ]]; then echo "quay=true" >> "$GITHUB_OUTPUT"; else echo "quay=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/login-action@v4
        if: vars.DOCKERHUB_IMAGE != '' && steps.optional_registries.outputs.dockerhub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: vars.QUAY_IMAGE != '' && steps.optional_registries.outputs.quay == 'true'
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rusty-feed
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-contexts: binaries=dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=runtime
      - uses: sigstore/cosign-installer@v3
      - name: Sign container digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            cosign sign --yes "${image%@*}@${DIGEST}"
          done <<< "$TAGS"
      - name: Publish optional Docker Hub aliases
        if: vars.DOCKERHUB_IMAGE != '' && steps.optional_registries.outputs.dockerhub == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE: ghcr.io/${{ github.repository_owner }}/rusty-feed
          TARGET: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          major="${version%%.*}"
          for tag in "$version" "$minor" "$major"; do
            docker buildx imagetools create --tag "$TARGET:$tag" "$SOURCE@$DIGEST"
          done
          cosign sign --yes "$TARGET@$DIGEST"
      - name: Publish optional Quay aliases
        if: vars.QUAY_IMAGE != '' && steps.optional_registries.outputs.quay == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE: ghcr.io/${{ github.repository_owner }}/rusty-feed
          TARGET: ${{ vars.QUAY_IMAGE }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          major="${version%%.*}"
          for tag in "$version" "$minor" "$major"; do
            docker buildx imagetools create --tag "$TARGET:$tag" "$SOURCE@$DIGEST"
          done
          cosign sign --yes "$TARGET@$DIGEST"
      - name: Smoke the published image against PostgreSQL
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rusty-feed@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 "$IMAGE" rusty-feed-cli --help >/dev/null
          docker network create rusty-feed-release-smoke
          docker run -d --name rusty-feed-release-db --network rusty-feed-release-smoke \
            -e POSTGRES_USER=rusty_feed -e POSTGRES_PASSWORD=rusty_feed -e POSTGRES_DB=rusty_feed \
            pgvector/pgvector:0.8.6-pg17
          for _ in $(seq 1 45); do
            docker exec rusty-feed-release-db pg_isready -U rusty_feed -d rusty_feed && break
            sleep 1
          done
          docker run -d --name rusty-feed-release-app --network rusty-feed-release-smoke -p 18080:8080 \
            -e DATABASE_URL=postgres://rusty_feed:rusty_feed@rusty-feed-release-db:5432/rusty_feed \
            -e SESSION_SECRET=release-smoke-session-secret-32-bytes \
            -e ENCRYPTION_SECRET=release-smoke-encryption-secret-32-bytes \
            -e CACHE_ENABLED=false -e RUN_EMBEDDED_WORKER=false "$IMAGE"
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:18080/api/health/ready | grep -q '"status":"ready"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs rusty-feed-release-app
          exit 1
      - name: Tear down release smoke
        if: always()
        run: |
          docker rm -f rusty-feed-release-app rusty-feed-release-db >/dev/null 2>&1 || true
          docker network rm rusty-feed-release-smoke >/dev/null 2>&1 || true

  github-release:
    name: checksummed GitHub release
    needs: [binaries, package-smoke, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rusty-feed-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign binary archives and checksums with GitHub OIDC
        run: |
          set -euo pipefail
          for file in rusty-feed-*.tar.gz rusty-feed-*.tar.gz.sha256 rusty-feed-*.deb rusty-feed-*.rpm rusty-feed-*-packages.sha256 rusty-feed-*-sbom.spdx.json; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: rusty-feed-*
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: rusty-feed-*
