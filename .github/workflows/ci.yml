name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest

    # Postgres + pgvector so the DB integration tests (gated on TEST_DATABASE_URL)
    # actually run in CI. The tests apply migrations themselves (idempotent).
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: rusty_feed
          POSTGRES_PASSWORD: rusty_feed
          POSTGRES_DB: rusty_feed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusty_feed -d rusty_feed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://rusty_feed:rusty_feed@localhost:5432/rusty_feed
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create isolated browser test database
        env:
          PGPASSWORD: rusty_feed
        run: createdb --host localhost --port 5432 --username rusty_feed rusty_feed_e2e

      - name: Browser E2E
        env:
          PLAYWRIGHT_DATABASE_URL: postgres://rusty_feed:rusty_feed@localhost:5432/rusty_feed_e2e
          PLAYWRIGHT_REDIS_URL: redis://localhost:6379
        run: npm run test:e2e

      - name: Validate automatic/custom TLS and inbound HTTP/2
        run: scripts/test-tls-proxy.sh

      - name: Build (release)
        run: cargo build --release --workspace

  # Every commit that lands green on main gets a ready-to-run, multi-arch
  # container image on GHCR, so main is always deployable (e.g. to Dokploy)
  # without building from source on the target host. Release tags (v*.*.*) still
  # produce the signed, SBOM-attested images in release.yml.
  publish-image:
    name: publish · multi-arch image (main)
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rusty-feed
          # `main` tracks the tip of main; `main-<shortsha>` pins an exact commit
          # for reproducible/rollback deploys; `edge` is a convenient alias.
          tags: |
            type=raw,value=main
            type=raw,value=edge
            type=sha,prefix=main-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
