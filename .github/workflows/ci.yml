name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-and-test:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest

    # Postgres + pgvector so the DB integration tests (gated on TEST_DATABASE_URL)
    # actually run in CI. The tests apply migrations themselves (idempotent).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rustss
          POSTGRES_PASSWORD: rustss
          POSTGRES_DB: rustss
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rustss -d rustss"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://rustss:rustss@localhost:5432/rustss
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        env:
          PLAYWRIGHT_DATABASE_URL: postgres://rustss:rustss@localhost:5432/rustss
          PLAYWRIGHT_REDIS_URL: redis://localhost:6379
        run: npm run test:e2e

      - name: Build (release)
        run: cargo build --release --workspace
