[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/cache",
    "crates/feeds",
    "crates/extract",
    "crates/embed",
    "crates/llm",
    "crates/search",
    "crates/agents",
    "crates/web",
    "bins/server",
    "bins/worker",
    "bins/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/madpin/rusty-feed"
authors = ["Rusty Feed contributors"]

# Shared dependency versions. Add new deps here (per the development plan's
# milestones) and reference them from member crates with `dep.workspace = true`.
# Versions use conservative, well-established releases (see AGENTS.md).
[workspace.dependencies]
# internal crates
rusty-feed-core = { path = "crates/core" }
rusty-feed-db = { path = "crates/db" }
rusty-feed-cache = { path = "crates/cache" }
rusty-feed-feeds = { path = "crates/feeds" }
rusty-feed-extract = { path = "crates/extract" }
rusty-feed-embed = { path = "crates/embed" }
rusty-feed-llm = { path = "crates/llm" }
rusty-feed-search = { path = "crates/search" }
rusty-feed-agents = { path = "crates/agents" }
rusty-feed-web = { path = "crates/web" }

# runtime / web
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "timeout", "catch-panic"] }

# errors / (de)serialization
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# configuration
figment = { version = "0.10", features = ["env", "toml"] }
dotenvy = "0.15"

# database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
    "json",
] }
uuid = { version = "1", features = ["v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
time-tz = "2.0"
sha2 = "0.10"

# cache
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }

# auth / web UI
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
askama = "0.12"
base64 = "0.22"
rust-embed = { version = "8", features = ["debug-embed"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
ammonia = "4"
html-escape = "0.2"
htmd = "0.5.5"
pulldown-cmark = "0.13.4"

# HTTP client (feeds, extraction, OAuth, LLM) — rustls, no OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "stream", "socks"] }

# feeds / extraction
feed-rs = "2"
url = "2"
ipnet = "2"
md5 = "0.7"
regex = "1.11"
scraper = "0.20"
lol_html = "3"
dom_smoothie = "0.18.0"
chromiumoxide = "0.9.1"
fastembed = { version = "6.0.2", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }

# crypto (secrets at rest)
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
sd-notify = "0.5"

# allocator — glibc's default per-thread arenas fragment badly under the
# server/worker's concurrent HTML-parsing workload (see docs/FINDINGS.md);
# jemalloc decays/returns freed arena memory to the OS instead.
tikv-jemallocator = "0.7"

[profile.dev]
# Keep source locations for backtraces without retaining full debug information.
debug = "line-tables-only"

[profile.release]
# Optimize for the low-footprint, self-hosted target.
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
