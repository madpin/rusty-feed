# Rusty Feed — full self-contained stack that PULLS the prebuilt image.
#
# Unlike docker/compose.yaml (which BUILDS from source on the host), this file
# runs the multi-arch image published for every green commit on main:
#   ghcr.io/madpin/rusty-feed:main         # tip of main (rolling, auto-updates)
#   ghcr.io/madpin/rusty-feed:main-<sha>   # pinned to one commit (reproducible)
#   ghcr.io/madpin/rusty-feed:vX.Y.Z       # signed, SBOM-attested release
# Override the image/tag with RUSTY_FEED_IMAGE (e.g. your own fork's GHCR path).
#
# ── Deploy to Dokploy ─────────────────────────────────────────────────────────
#   1. Project → Create Service → Compose.
#   2. Point it at this Git repo and set the Compose Path to
#      docker/compose.dokploy.yaml (or paste this file into a Raw compose service).
#   3. Environment: set SESSION_SECRET, ENCRYPTION_SECRET (openssl rand -base64 48)
#      and BASE_URL=https://your-domain. See docs/GETTING_STARTED.md §C.
#   4. Domains → add your domain → service "app", container port 8080 (Dokploy
#      injects the Traefik labels + network and issues the TLS certificate).
#   5. Deploy. Migrations run automatically on boot; verify at /api/health.
#
# ── Plain Docker Compose (no Dokploy) ─────────────────────────────────────────
#   Add a host port to the app service, e.g.  ports: ["8080:8080"]  then:
#     SESSION_SECRET=... ENCRYPTION_SECRET=... \
#       docker compose -f docker/compose.dokploy.yaml up -d

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    shm_size: "${PG_SHM_SIZE:-256mb}"
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - jit=${PG_JIT:-off}
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-rusty_feed}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-rusty_feed}"
      POSTGRES_DB: "${POSTGRES_DB:-rusty_feed}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    command:
      - /bin/sh
      - -c
      - if [ -n "$${REDIS_PASSWORD:-}" ]; then exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD"; else exec redis-server --save "" --appendonly no; fi
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD:-}\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Remote headless Chrome for the extraction agent's bounded fallback. Kept
  # separate so the app image stays small and browser memory is capped alone.
  chromium:
    image: chromedp/headless-shell:latest
    restart: unless-stopped
    init: true
    command:
      - --no-sandbox
      - --disable-gpu
      - --headless=new

  app:
    image: ${RUSTY_FEED_IMAGE:-ghcr.io/madpin/rusty-feed:main}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Dokploy routes to this after you add a domain (service: app, port 8080).
    # No host port is published so it never clashes with Traefik or other stacks.
    expose:
      - "8080"
    environment:
      RUSTY_FEED_CONFIG_FILE: "${RUSTY_FEED_CONFIG_FILE:-}"
      BIND_ADDR: "${BIND_ADDR:-0.0.0.0:8080}"
      # Public URL — used for absolute links, OAuth redirects, and passkeys.
      # Set this to your real https origin in the Dokploy environment editor.
      BASE_URL: "${BASE_URL:-http://localhost:8080}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      SYSTEMD_NOTIFY_ENABLED: "${SYSTEMD_NOTIFY_ENABLED:-true}"
      PWA_NAME: "${PWA_NAME:-Rusty Feed}"
      PWA_SHORT_NAME: "${PWA_SHORT_NAME:-Rusty Feed}"
      PWA_THEME_COLOR: "${PWA_THEME_COLOR:-#2563eb}"
      PWA_BACKGROUND_COLOR: "${PWA_BACKGROUND_COLOR:-#f8fafc}"
      EXTERNAL_LINKS_NEW_TAB_REQUIRED: "${EXTERNAL_LINKS_NEW_TAB_REQUIRED:-false}"
      PUBLIC_ARTICLE_SHARING_ENABLED: "${PUBLIC_ARTICLE_SHARING_ENABLED:-true}"
      PUBLIC_SHARE_DEFAULT_LIFETIME_DAYS: "${PUBLIC_SHARE_DEFAULT_LIFETIME_DAYS:-30}"
      PUBLIC_SHARE_MAX_LIFETIME_DAYS: "${PUBLIC_SHARE_MAX_LIFETIME_DAYS:-3650}"
      PUBLIC_SHARE_ALLOW_INFINITE: "${PUBLIC_SHARE_ALLOW_INFINITE:-true}"
      API_ENABLED: "${API_ENABLED:-true}"
      GREADER_API_ENABLED: "${GREADER_API_ENABLED:-true}"
      FEVER_API_ENABLED: "${FEVER_API_ENABLED:-true}"
      CUSTOM_CSS_ENABLED: "${CUSTOM_CSS_ENABLED:-true}"
      CUSTOM_JAVASCRIPT_ENABLED: "${CUSTOM_JAVASCRIPT_ENABLED:-false}"
      UI_CUSTOMIZATION_MAX_BYTES: "${UI_CUSTOMIZATION_MAX_BYTES:-65536}"
      PASSKEYS_ENABLED: "${PASSKEYS_ENABLED:-false}"
      PASSKEY_RP_NAME: "${PASSKEY_RP_NAME:-Rusty Feed}"
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER:-rusty_feed}:${POSTGRES_PASSWORD:-rusty_feed}@postgres:5432/${POSTGRES_DB:-rusty_feed}}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_NAMESPACE: "${CACHE_NAMESPACE:-rusty-feed}"
      # Required secrets — generate each with: openssl rand -base64 48
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET, e.g. openssl rand -base64 48}"
      ENCRYPTION_SECRET: "${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET, e.g. openssl rand -base64 48}"
      REGISTRATION_MODE: "${REGISTRATION_MODE:-open}"
      REVERSE_PROXY_AUTH_ENABLED: "${REVERSE_PROXY_AUTH_ENABLED:-false}"
      REVERSE_PROXY_AUTH_TRUSTED_CIDRS: "${REVERSE_PROXY_AUTH_TRUSTED_CIDRS:-127.0.0.1/32,::1/128}"
      REVERSE_PROXY_AUTH_USER_HEADER: "${REVERSE_PROXY_AUTH_USER_HEADER:-x-remote-user}"
      REVERSE_PROXY_AUTH_NAME_HEADER: "${REVERSE_PROXY_AUTH_NAME_HEADER:-x-remote-name}"
      REVERSE_PROXY_AUTH_AUTO_PROVISION: "${REVERSE_PROXY_AUTH_AUTO_PROVISION:-true}"
      REVERSE_PROXY_AUTH_ALLOWED_DOMAINS: "${REVERSE_PROXY_AUTH_ALLOWED_DOMAINS:-}"
      REVERSE_PROXY_AUTH_ADMIN_EMAILS: "${REVERSE_PROXY_AUTH_ADMIN_EMAILS:-}"
      REVERSE_PROXY_AUTH_LOGOUT_URL: "${REVERSE_PROXY_AUTH_LOGOUT_URL:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      OAUTH_CLIENT_ID: "${OAUTH_CLIENT_ID:-}"
      OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET:-}"
      OAUTH_AUTH_URL: "${OAUTH_AUTH_URL:-}"
      OAUTH_TOKEN_URL: "${OAUTH_TOKEN_URL:-}"
      OAUTH_USERINFO_URL: "${OAUTH_USERINFO_URL:-}"
      OAUTH_PROVIDER_NAME: "${OAUTH_PROVIDER_NAME:-}"
      EMBEDDINGS_ENABLED: "${EMBEDDINGS_ENABLED:-true}"
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-local}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-10}"
      EMBEDDING_AUTO_GENERATE: "${EMBEDDING_AUTO_GENERATE:-false}"
      MODEL_CACHE_DIR: "${MODEL_CACHE_DIR:-/var/lib/rusty-feed/models}"
      # Optional AI summaries (leave unset to disable):
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      SEARCH_MODE: "${SEARCH_MODE:-hybrid}"
      SEARCH_TEXT_CONFIG: "${SEARCH_TEXT_CONFIG:-simple}"
      SEARCH_SEMANTIC_WEIGHT_PERCENT: "${SEARCH_SEMANTIC_WEIGHT_PERCENT:-60}"
      LLM_PROVIDER: "${LLM_PROVIDER:-openai}"
      LLM_SUMMARY_MODEL: "${LLM_SUMMARY_MODEL:-gpt-4o-mini}"
      LLM_DIGEST_MODEL: "${LLM_DIGEST_MODEL:-gpt-4o-mini}"
      LLM_AUTO_SUMMARIZE: "${LLM_AUTO_SUMMARIZE:-false}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://localhost:11434}"
      CHROMIUM_ENABLED: "${CHROMIUM_ENABLED:-true}"
      CHROMIUM_CDP_URL: "${CHROMIUM_CDP_URL:-http://chromium:9222}"
      EXTRACTION_TIMEOUT_MS: "${EXTRACTION_TIMEOUT_MS:-30000}"
      EXTRACTION_DELAY_MS: "${EXTRACTION_DELAY_MS:-3000}"
      ARTICLE_PAGE_EAGER_EXTRACTION: "${ARTICLE_PAGE_EAGER_EXTRACTION:-true}"
      RESPECT_ROBOTS_TXT: "${RESPECT_ROBOTS_TXT:-true}"
      OUTBOUND_USER_AGENT: "${OUTBOUND_USER_AGENT:-Rusty-Feed/0.1 (+https://github.com/madpin/rusty-feed)}"
      OUTBOUND_HTTP1_ONLY: "${OUTBOUND_HTTP1_ONLY:-false}"
      FEEDS_ALLOW_PRIVATE_NETWORK: "${FEEDS_ALLOW_PRIVATE_NETWORK:-false}"
      TRACKING_URL_CLEANUP_ENABLED: "${TRACKING_URL_CLEANUP_ENABLED:-true}"
      TRACKING_URL_EXTRA_PARAMETERS: "${TRACKING_URL_EXTRA_PARAMETERS:-}"
      TRACKING_URL_DOMAIN_EXCEPTIONS: "${TRACKING_URL_DOMAIN_EXCEPTIONS:-}"
      TRACKING_PIXEL_STRICTNESS: "${TRACKING_PIXEL_STRICTNESS:-balanced}"
      TRACKING_PIXEL_BLOCKED_HOSTS: "${TRACKING_PIXEL_BLOCKED_HOSTS:-}"
      TRACKING_PIXEL_ALLOWED_HOSTS: "${TRACKING_PIXEL_ALLOWED_HOSTS:-}"
      YOUTUBE_EMBEDS_ENABLED: "${YOUTUBE_EMBEDS_ENABLED:-true}"
      YOUTUBE_SOURCE_HOSTS: "${YOUTUBE_SOURCE_HOSTS:-}"
      YOUTUBE_ALTERNATIVE_PLAYER_NAME: "${YOUTUBE_ALTERNATIVE_PLAYER_NAME:-}"
      YOUTUBE_ALTERNATIVE_PLAYER_URL: "${YOUTUBE_ALTERNATIVE_PLAYER_URL:-}"
      YOUTUBE_DURATION_ENABLED: "${YOUTUBE_DURATION_ENABLED:-false}"
      YOUTUBE_DURATION_DAILY_BUDGET: "${YOUTUBE_DURATION_DAILY_BUDGET:-100}"
      YOUTUBE_DURATION_CACHE_DAYS: "${YOUTUBE_DURATION_CACHE_DAYS:-30}"
      MEDIA_PROXY_ENABLED: "${MEDIA_PROXY_ENABLED:-true}"
      MEDIA_PROXY_MAX_BYTES: "${MEDIA_PROXY_MAX_BYTES:-67108864}"
      MEDIA_PROXY_CACHE_BUDGET_BYTES: "${MEDIA_PROXY_CACHE_BUDGET_BYTES:-2147483648}"
      MEDIA_PROXY_CACHE_TTL_SECONDS: "${MEDIA_PROXY_CACHE_TTL_SECONDS:-604800}"
      MEDIA_PROXY_NEGATIVE_TTL_SECONDS: "${MEDIA_PROXY_NEGATIVE_TTL_SECONDS:-300}"
      MEDIA_PROXY_EXTRA_INLINE_MIME_TYPES: "${MEDIA_PROXY_EXTRA_INLINE_MIME_TYPES:-}"
      ARTICLE_RETENTION_DAYS: "${ARTICLE_RETENTION_DAYS:-0}"
      RETENTION_AGE_BASIS: "${RETENTION_AGE_BASIS:-published}"
      JOB_RETENTION_DAYS: "${JOB_RETENTION_DAYS:-7}"
      AGENT_RUN_RETENTION_DAYS: "${AGENT_RUN_RETENTION_DAYS:-30}"
      ENABLE_CRON_JOBS: "${ENABLE_CRON_JOBS:-true}"
      RUN_EMBEDDED_WORKER: "${RUN_EMBEDDED_WORKER:-true}"
      FEED_REFRESH_SCHEDULE: "${FEED_REFRESH_SCHEDULE:-*/5 * * * *}"
      CLEANUP_SCHEDULE: "${CLEANUP_SCHEDULE:-0 3 * * *}"
      FEED_REFRESH_CONCURRENCY: "${FEED_REFRESH_CONCURRENCY:-6}"
      INTERACTIVE_JOB_CONCURRENCY: "${INTERACTIVE_JOB_CONCURRENCY:-2}"
      SAVED_SEARCH_CONCURRENCY: "${SAVED_SEARCH_CONCURRENCY:-5}"
      JOB_LOCK_TIMEOUT_MS: "${JOB_LOCK_TIMEOUT_MS:-600000}"
      AI_LLM_GLOBAL_DAILY_USD: "${AI_LLM_GLOBAL_DAILY_USD:-0}"
      AI_LLM_PER_USER_DAILY_USD: "${AI_LLM_PER_USER_DAILY_USD:-0}"
      AI_LLM_PER_USER_DAILY_CALLS: "${AI_LLM_PER_USER_DAILY_CALLS:-0}"
      AI_EMBED_PER_USER_DAILY_CALLS: "${AI_EMBED_PER_USER_DAILY_CALLS:-0}"
      FEED_MAX_ITEMS_PER_REFRESH: "${FEED_MAX_ITEMS_PER_REFRESH:-0}"
      FEED_MAX_ARTICLES: "${FEED_MAX_ARTICLES:-0}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}"
      RATE_LIMIT_AUTH_PER_MIN: "${RATE_LIMIT_AUTH_PER_MIN:-10}"
      RATE_LIMIT_API_PER_MIN: "${RATE_LIMIT_API_PER_MIN:-600}"
      RATE_LIMIT_FEED_ADD_PER_MIN: "${RATE_LIMIT_FEED_ADD_PER_MIN:-60}"
      RATE_LIMIT_SEARCH_PER_MIN: "${RATE_LIMIT_SEARCH_PER_MIN:-120}"
      RATE_LIMIT_SUMMARIZE_PER_MIN: "${RATE_LIMIT_SUMMARIZE_PER_MIN:-20}"
      RATE_LIMIT_OPML_PER_MIN: "${RATE_LIMIT_OPML_PER_MIN:-10}"
      RATE_LIMIT_MEDIA_PER_MIN: "${RATE_LIMIT_MEDIA_PER_MIN:-1800}"
      QUOTA_MAX_SUBSCRIPTIONS: "${QUOTA_MAX_SUBSCRIPTIONS:-0}"
      QUOTA_MAX_SAVED_SEARCHES: "${QUOTA_MAX_SAVED_SEARCHES:-0}"
      QUOTA_MAX_CATEGORIES: "${QUOTA_MAX_CATEGORIES:-0}"
      QUOTA_MAX_API_TOKENS: "${QUOTA_MAX_API_TOKENS:-0}"
      QUOTA_MAX_INTEGRATIONS: "${QUOTA_MAX_INTEGRATIONS:-0}"
      QUOTA_MAX_PUBLIC_SHARES: "${QUOTA_MAX_PUBLIC_SHARES:-0}"
      EMAIL_VERIFICATION_REQUIRED: "${EMAIL_VERIFICATION_REQUIRED:-false}"
      SMTP_URL: "${SMTP_URL:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      MIN_PASSWORD_LENGTH: "${MIN_PASSWORD_LENGTH:-10}"
      LOGIN_MAX_FAILURES: "${LOGIN_MAX_FAILURES:-10}"
      LOGIN_LOCKOUT_SECONDS: "${LOGIN_LOCKOUT_SECONDS:-900}"
      CAPTCHA_PROVIDER: "${CAPTCHA_PROVIDER:-}"
      CAPTCHA_SITE_KEY: "${CAPTCHA_SITE_KEY:-}"
      CAPTCHA_SECRET: "${CAPTCHA_SECRET:-}"
      LEGAL_CONTACT_EMAIL: "${LEGAL_CONTACT_EMAIL:-}"
      LEGAL_ENTITY_NAME: "${LEGAL_ENTITY_NAME:-}"
      REQUIRE_TOS_ACCEPTANCE: "${REQUIRE_TOS_ACCEPTANCE:-false}"
      DEMO_MODE: "${DEMO_MODE:-false}"
      DEMO_RESET_SCHEDULE: "${DEMO_RESET_SCHEDULE:-0 4 * * *}"
      DEMO_MAX_SUBSCRIPTIONS: "${DEMO_MAX_SUBSCRIPTIONS:-20}"
      DEMO_ADMIN_READONLY: "${DEMO_ADMIN_READONLY:-true}"
      DEMO_SESSION_TTL_HOURS: "${DEMO_SESSION_TTL_HOURS:-24}"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
    volumes:
      - "models:${MODEL_CACHE_DIR:-/var/lib/rusty-feed/models}"

volumes:
  pgdata:
  models:
