{% extends "app_base.html" %}
{% block title %}Preferences{% endblock %}
{% block sidebar %}
<h2>Settings</h2>
<ul>
  <li><a href="/settings/preferences">Preferences</a></li>
  <li><a href="/settings/tokens">API tokens</a></li>
</ul>
{% endblock %}
{% block content %}
<h1>Preferences</h1>
{% if saved %}<p class="notice">Preferences saved.</p>{% endif %}
<form method="post" action="/settings/preferences" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
  <label>Theme
    <select name="theme">
      <option value="system"{% if prefs_theme == "system" %} selected{% endif %}>System</option>
      <option value="light"{% if prefs_theme == "light" %} selected{% endif %}>Light</option>
      <option value="dark"{% if prefs_theme == "dark" %} selected{% endif %}>Dark</option>
    </select>
  </label>
  <label>Articles per page
    <input type="number" name="articles_per_page" min="5" max="100" value="{{ prefs_per_page }}" />
  </label>
  <label>
    <input type="checkbox" name="show_read_articles" value="true"{% if prefs_show_read %} checked{% endif %} />
    Show read articles
  </label>
  <button type="submit" class="primary">Save</button>
</form>
{% endblock %}
