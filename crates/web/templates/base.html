<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>{% block title %}Rusty Feed{% endblock %}</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/icon-192.png" />
    <link rel="stylesheet" href="/static/app.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="auth-brand" href="/"><span class="brand-mark">R</span><span>Rusty Feed</span></a>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> · <a href="/acceptable-use">Acceptable Use</a> · <a href="/abuse">Abuse</a>
    </footer>
  </body>
</html>
